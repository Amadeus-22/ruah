# Local database. The system MySQL usually owns 3306, so this one listens on
# 3307, bound to 127.0.0.1 only.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ruah
      MYSQL_USER: ruah
      MYSQL_PASSWORD: ruah
      MYSQL_ROOT_PASSWORD: root-local
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db:
