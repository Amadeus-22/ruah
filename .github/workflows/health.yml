name: Health

# Falha (e o GitHub manda e-mail) se o sistema não responder ou se o backup do dia não existir.
on:
  schedule:
    - cron: '*/30 * * * *'   # disponibilidade
    - cron: '0 10 * * *'     # backup (07:00 em Brasília, depois do backup das 03:00)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uptime:
    if: github.event.schedule != '0 10 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Site responds
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 15 -o /dev/null https://pamelabarbosa.com.br/up && exit 0
            sleep 20
          done
          echo "::error::https://pamelabarbosa.com.br/up did not answer 3 times in a row"
          exit 1

  backup:
    if: github.event.schedule == '0 10 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Latest backup is recent and not empty
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$VPS_USER@$VPS_HOST" '
            f=$(find ~/ruah/backups -name "ruah-*.sql.gz" -mmin -1560 -size +1k | sort | tail -1)
            if [ -z "$f" ]; then echo "::error::no backup newer than 26 h"; ls -l ~/ruah/backups; exit 1; fi
            gzip -t "$f" && echo "ok: $f ($(du -h "$f" | cut -f1))"'
